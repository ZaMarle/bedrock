# =============================================================================
# MAIN PLAYBOOK - The entry point that orchestrates everything
# =============================================================================
#
# A "playbook" is Ansible's term for a script. It defines WHAT to do and
# WHERE to do it. This playbook says:
#   - "hosts: all"   → run on all machines in the inventory (the zama server)
#   - "become: true"  → use sudo (most tasks need root privileges)
#   - "roles: [...]"  → run these roles in order, top to bottom
#
# Each role is a folder under roles/ that contains its own tasks.
# Roles run sequentially — network first, then prerequisites, etc.
# If any task in a role fails, the playbook stops.
#
# To run this playbook from WSL:
#   cd /mnt/c/Users/qu4ck/source/bedrock
#   ./run.sh
#
# Secrets (passed as env vars, never stored in files):
#   GITHUB_RUNNER_TOKEN: from https://github.com/organizations/zamarle/settings/actions/runners/new
#   GHCR_PAT: a GitHub PAT with read:packages scope
# =============================================================================

---
- name: Bootstrap single-node Kubernetes cluster
  hosts: all
  become: true
  roles:
    - network # Step 1: Set a static IP so the address never changes again
    - prerequisites # Step 2: Prepare the OS (swap off, kernel modules, sysctl)
    - containerd # Step 3: Install the container runtime (runs containers for k8s)
    - kubernetes # Step 4: Install kubeadm/kubelet/kubectl, init the cluster
    - calico # Step 5: Install the pod networking plugin (Calico)
    - github-runner # Step 6: Deploy a self-hosted GitHub Actions runner
